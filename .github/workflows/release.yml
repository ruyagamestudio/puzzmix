name: Yayın paketi (AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install

      - name: Yazı tiplerini göm
        run: node scripts/fonts.mjs

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: İkonları oluştur
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1B1F4B' --iconBackgroundColorDark '#1B1F4B'

      - name: Dik ekrana kilitle
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Sürüm numarasını ayarla
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 sırrı eksik"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yukleme.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/yukleme.jks" >> "$GITHUB_ENV"
          printf '\nandroid {\n    signingConfigs {\n        release {\n            storeFile file(System.getenv("KEYSTORE_PATH"))\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias "puzzmix"\n            keyPassword System.getenv("KEYSTORE_PASSWORD")\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\n' >> android/app/build.gradle

      - name: İmzalı AAB derle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: AAB'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: puzzmix-yayin-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
