name: Android

on:
  push:
    branches: [main, android-paketi]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm install

      - name: Yazı tiplerini göm
        run: node scripts/fonts.mjs

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: İkonları oluştur
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1B1F4B' --iconBackgroundColorDark '#1B1F4B'

      - name: Dik ekrana kilitle
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Test APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: puzzmix-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
